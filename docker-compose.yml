services:
  db:
    image: postgres:16
    container_name: radioassist-db
    environment:
      POSTGRES_USER: radioassist
      POSTGRES_PASSWORD: radioassist
      POSTGRES_DB: radioassist
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
